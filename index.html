<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Big Data Hub - IUPB</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">

  <!-- Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <aside class="sidebar">
    <div class="profile-box">
      <div class="hub-logo">🧠</div>
      <h1>Big Data Hub</h1>
      <b>Especialización en Big Data</b>
      <p>Información general, asignaturas y enlaces rápidos</p>
    </div>

    <nav class="menu">
      <button class="dropdown-button" onclick="loadHome()">
        <span>🏠 Inicio</span>
      </button>

      <details class="dropdown" open>
        <summary>📌 Información general</summary>
        <button onclick="loadSection('overview')">¿Qué es este Hub?</button>
        <button onclick="loadSection('program')">Sobre la especialización</button>
        <!-- <button onclick="loadSection('methodology')">Ruta de trabajo</button> -->
      </details>

      <details class="dropdown" open>
        <summary>🎓 Asignaturas</summary>
        <button onclick="loadCourse('asignatura_01')">Asignatura 01</button>
        <button onclick="loadCourse('asignatura_02')">Asignatura 02</button>
        <button onclick="loadCourse('asignatura_03')">Asignatura 03</button>
        <button onclick="loadCourse('asignatura_04')">Asignatura 04</button>
        <button onclick="loadCourse('asignatura_05')">Asignatura 05</button>
        <button onclick="loadCourse('asignatura_06')">Asignatura 06</button>
        <button onclick="loadCourse('asignatura_07')">Asignatura 07</button>
        <button onclick="loadCourse('asignatura_08')">Asignatura 08</button>
        <button onclick="loadCourse('asignatura_09')">Asignatura 09</button>
        <button onclick="loadCourse('asignatura_10')">Asignatura 10</button>
      </details>

      <details class="dropdown">
        <summary>🔗 Enlaces rápidos</summary>
        <button onclick="openExternal('https://classroom.google.com/')">Google Classroom</button>
        <button onclick="openExternal('https://colab.research.google.com/')">Google Colab</button>
        <button onclick="openExternal('https://github.com/')">GitHub</button>
        <button onclick="openExternal('https://www.kaggle.com/datasets')">Kaggle Datasets</button>
        <button onclick="loadContact()">Contacto</button>
      </details>
    </nav>
  </aside>

  <main class="main">
    <div id="content"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
